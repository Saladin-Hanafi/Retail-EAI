services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "15672:15672"   # management dashboard (observability)
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # persistence across restarts
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  pos-service:
    build: ./apps/pos-service
    container_name: pos-service
    environment:
      SERVICE_NAME: pos-service
      POS_DB_PATH: /data/pos.db
      INTEGRATION_INGEST_URL: http://integration-engine:8080/events/sale
      PORT: "5001"
    volumes:
      - pos_data:/data
    depends_on:
      - integration-engine

  inventory-service:
    build: ./apps/inventory-service
    container_name: inventory-service
    environment:
      SERVICE_NAME: inventory-service
      INVENTORY_DB_PATH: /data/inventory.db
      PORT: "5002"
    volumes:
      - inventory_data:/data

  accounting-service:
    build: ./apps/accounting-service
    container_name: accounting-service
    environment:
      SERVICE_NAME: accounting-service
      ACCOUNTING_DB_PATH: /data/accounting.db
      PORT: "5003"
    volumes:
      - accounting_data:/data

  integration-engine:
    build: ./integration/integration-engine
    container_name: integration-engine
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      EXCHANGE_NAME: integration.events
      DLX_NAME: integration.dlx
      QUEUE_INVENTORY: inventory.sale
      QUEUE_ACCOUNTING: accounting.sale
      QUEUE_DEAD: integration.dead
      INVENTORY_URL: http://inventory-service:5002
      ACCOUNTING_URL: http://accounting-service:5003
      SALES_REVENUE_ACCOUNT: 4000-Revenue
      CASH_ACCOUNT: 1000-Cash
      MAX_RETRIES: "3"
      PORT: "8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./integration/api-gateway
    container_name: api-gateway
    environment:
      POS_URL: http://pos-service:5001
      INVENTORY_URL: http://inventory-service:5002
      ACCOUNTING_URL: http://accounting-service:5003
      INTEGRATION_URL: http://integration-engine:8080
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      - pos-service
      - inventory-service
      - accounting-service
      - integration-engine

volumes:
  rabbitmq_data:
  pos_data:
  inventory_data:
  accounting_data:
