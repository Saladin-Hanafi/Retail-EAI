openapi: 3.0.3
info:
  title: Retail EAI — API Gateway
  version: "1.0"
  description: >
    Single entry point for the integrated retail platform. Routes to POS (JSON/REST),
    Inventory (XML), and Accounting (JSON, account-centric schema) through the
    integration layer. All cross-system flow is mediated by the Integration Engine —
    no service reads another service's database directly.

    **End-to-end flow:**
    POST /api/pos/sales → POS stores sale → Integration Engine normalises to
    Canonical Data Model → publishes to RabbitMQ fanout exchange →
    Inventory queue (translated to XML) + Accounting queue (translated to ledger JSON).

    **Transformation examples** are documented in the `TransformationChain` example
    under each relevant endpoint and in `components/examples`.

servers:
  - url: http://localhost:8000
    description: Local Docker Compose environment (API Gateway)
  - url: http://localhost:8080
    description: Integration Engine (direct — internal use / testing only)

tags:
  - name: Gateway
    description: Health and routing
  - name: POS
    description: Point-of-Sale — native format JSON
  - name: Inventory
    description: Inventory / Warehouse — native format XML
  - name: Accounting
    description: Accounting ledger — native format JSON (account-centric schema)
  - name: Integration Engine
    description: Internal ingest & event endpoint (Channel Adapter / Message Endpoint EIP)

paths:

  /health:
    get:
      tags: [Gateway]
      summary: Gateway + backend health check
      description: Polls the gateway itself and each downstream service.
      responses:
        "200":
          description: All services healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                gateway: ok
                pos-service: ok
                inventory-service: ok
                accounting-service: ok
                integration-engine: ok

  /api/pos/sales:
    get:
      tags: [POS]
      summary: List all sales (POS native JSON)
      responses:
        "200":
          description: Array of sale records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosSaleRecord"
              example:
                - id: 1
                  correlation_id: "a1b2c3d4-0000-0000-0000-000000000001"
                  sku: SKU-1002
                  product_name: Wireless Mouse
                  qty: 3
                  unit_price: 150000
                  total: 450000
                  cashier: siti
                  timestamp: "2024-06-01T10:00:00Z"

    post:
      tags: [POS]
      summary: Record a sale — triggers end-to-end integration
      description: >
        Stores the sale in the POS database, then emits a `SaleCompleted` event
        to the Integration Engine via HTTP. The integration engine normalises the
        event to the **Canonical Data Model**, publishes it to the RabbitMQ fanout
        exchange, and two subscriber queues deliver it to Inventory (XML) and
        Accounting (ledger JSON).

        See the `TransformationChain` example below for the full
        before → canonical → after transformation across all three systems.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSaleInput"
            examples:
              basic:
                summary: Minimal valid request
                value:
                  sku: SKU-1002
                  product_name: Wireless Mouse
                  qty: 3
                  unit_price: 150000
                  cashier: siti
              with_transformation:
                summary: "Transformation chain: POS JSON → Canonical → XML + Ledger JSON"
                $ref: "#/components/examples/TransformationChain"
      responses:
        "201":
          description: Sale recorded and integration event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleCreatedResponse"
              example:
                id: 7
                correlation_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                total: 450000
                status: integration_event_sent
        "400":
          description: Missing required fields (sku, qty, unit_price)
          content:
            application/json:
              example:
                error: "missing required fields: sku, qty, unit_price"

  /api/inventory/stock:
    get:
      tags: [Inventory]
      summary: List current stock levels (Inventory native XML)
      description: >
        Returns stock in **XML format** — the Inventory service's native format.
        This is intentionally different from the JSON used by POS and Accounting,
        demonstrating heterogeneous data handling. The Integration Engine
        translates the canonical JSON event into `<StockDeduction>` XML
        before calling this service's `/stock/deduct` endpoint.
      responses:
        "200":
          description: Stock list in XML
          content:
            application/xml:
              example: |
                <StockList>
                  <Item>
                    <Sku>SKU-1001</Sku>
                    <ProductName>USB-C Cable</ProductName>
                    <Quantity>100</Quantity>
                  </Item>
                  <Item>
                    <Sku>SKU-1002</Sku>
                    <ProductName>Wireless Mouse</ProductName>
                    <Quantity>47</Quantity>
                  </Item>
                  <Item>
                    <Sku>SKU-1003</Sku>
                    <ProductName>Mechanical Keyboard</ProductName>
                    <Quantity>30</Quantity>
                  </Item>
                </StockList>

  /api/accounting/journal:
    get:
      tags: [Accounting]
      summary: List journal entries (Accounting native JSON)
      description: >
        Returns double-entry ledger records. Each sale generates **two** journal
        entries: one credit to the Revenue account and one debit to Cash.
        Note the schema difference from POS JSON — accounting uses
        `account_code / credit / debit` instead of `sku / qty / unit_price`.
      responses:
        "200":
          description: Array of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
              example:
                - id: 1
                  correlation_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  account_code: "4000-Revenue"
                  credit: 450000
                  debit: 0
                  currency: IDR
                  memo: "Sale of 3 x Wireless Mouse (SKU-1002)"
                  timestamp: "2024-06-01T10:00:01Z"
                - id: 2
                  correlation_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  account_code: "1000-Cash"
                  credit: 0
                  debit: 450000
                  currency: IDR
                  memo: "Cash received — Sale of 3 x Wireless Mouse (SKU-1002)"
                  timestamp: "2024-06-01T10:00:01Z"

  /events/sale:
    post:
      tags: [Integration Engine]
      summary: Ingest a SaleCompleted event (Channel Adapter / Message Endpoint)
      description: >
        **EIP: Channel Adapter + Message Endpoint.**
        Receives the raw POS JSON event, normalises it to the **Canonical Data Model**
        (EIP: Canonical Data Model), assigns a `correlation_id` for idempotency,
        and publishes to the RabbitMQ fanout exchange `integration.events`
        (EIP: Publish-Subscribe Channel).

        Two durable subscriber queues receive the canonical message:
        - `inventory.sale` → Message Translator (canonical JSON → XML) → Inventory `/stock/deduct`
        - `accounting.sale` → Message Translator (canonical JSON → ledger JSON) → Accounting `/journal`

        Failed deliveries retry up to `MAX_RETRIES` times before routing to the
        dead-letter queue `integration.dead` (EIP: Dead-Letter Channel).
        Duplicate events with the same `correlation_id` are silently dropped (idempotency).

        > **Note:** This endpoint is called internally by POS. External clients should
        > use `POST /api/pos/sales` via the API Gateway instead.
      servers:
        - url: http://localhost:8080
          description: Integration Engine direct (internal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosEventRaw"
            example:
              event_type: SaleCompleted
              sku: SKU-1002
              product_name: Wireless Mouse
              qty: 3
              unit_price: 150000
              total: 450000
              cashier: siti
              source: pos-service
      responses:
        "202":
          description: Event accepted and published to message broker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
              example:
                status: accepted
                correlation_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        "400":
          description: Malformed event payload
          content:
            application/json:
              example:
                error: "missing required field: sku"

components:

  schemas:

    PosSaleInput:
      type: object
      required: [sku, qty, unit_price]
      description: Payload sent by external clients to create a new sale.
      properties:
        sku:
          type: string
          example: SKU-1002
        product_name:
          type: string
          example: Wireless Mouse
        qty:
          type: integer
          minimum: 1
          example: 3
        unit_price:
          type: number
          format: float
          example: 150000
        cashier:
          type: string
          example: siti

    PosSaleRecord:
      type: object
      description: Sale record as stored and returned by the POS service.
      properties:
        id:          { type: integer }
        correlation_id: { type: string, format: uuid }
        sku:         { type: string }
        product_name: { type: string }
        qty:         { type: integer }
        unit_price:  { type: number }
        total:       { type: number }
        cashier:     { type: string }
        timestamp:   { type: string, format: date-time }

    SaleCreatedResponse:
      type: object
      properties:
        id:             { type: integer }
        correlation_id: { type: string, format: uuid }
        total:          { type: number }
        status:
          type: string
          enum: [integration_event_sent, integration_event_failed]

    PosEventRaw:
      type: object
      description: >
        Raw event emitted by POS to the Integration Engine.
        The engine normalises this into the Canonical Data Model.
      required: [event_type, sku, qty, unit_price, total]
      properties:
        event_type:
          type: string
          enum: [SaleCompleted]
        sku:          { type: string }
        product_name: { type: string }
        qty:          { type: integer }
        unit_price:   { type: number }
        total:        { type: number }
        cashier:      { type: string }
        source:       { type: string }
        correlation_id:
          type: string
          format: uuid
          description: Optional. Engine generates one if absent.

    CanonicalSaleEvent:
      type: object
      description: >
        **EIP: Canonical Data Model.**
        Internal normalised format used by the Integration Engine.
        Decouples all downstream systems from POS schema changes.
      properties:
        canonical_version: { type: string, example: "1.0" }
        event_type:
          type: string
          enum: [SaleCompleted]
        correlation_id:
          type: string
          format: uuid
          description: Unique event ID — used for idempotency / deduplication.
        occurred_at:   { type: string, format: date-time }
        source_system: { type: string, example: pos-service }
        product:
          type: object
          properties:
            sku:  { type: string }
            name: { type: string }
        quantity: { type: integer }
        monetary:
          type: object
          properties:
            unit_price: { type: number }
            total:      { type: number }
            currency:   { type: string, example: IDR }
        actor: { type: string, description: Cashier or system that created the event }

    JournalEntry:
      type: object
      description: >
        Accounting ledger entry. Schema is intentionally different from POS JSON —
        uses account_code/credit/debit (double-entry bookkeeping).
        One sale generates two entries (Revenue credit + Cash debit).
      properties:
        id:             { type: integer }
        correlation_id: { type: string, format: uuid }
        account_code:   { type: string, example: "4000-Revenue" }
        credit:         { type: number, example: 450000 }
        debit:          { type: number, example: 0 }
        currency:       { type: string, example: IDR }
        memo:           { type: string }
        timestamp:      { type: string, format: date-time }

    EventAcceptedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [accepted]
        correlation_id:
          type: string
          format: uuid

    HealthResponse:
      type: object
      additionalProperties:
        type: string
        enum: [ok, error]
      example:
        gateway: ok
        pos-service: ok
        inventory-service: ok
        accounting-service: ok
        integration-engine: ok

  examples:

    TransformationChain:
      summary: "Full transformation: POS JSON → Canonical CDM → XML (Inventory) + Ledger JSON (Accounting)"
      description: >
        Demonstrates heterogeneous data handling across three formats.
        The Integration Engine applies two Message Translators
        (EIP: Message Translator) driven by a single Canonical Data Model
        (EIP: Canonical Data Model).

        Step 1 — POS emits raw JSON event to Integration Engine.
        Step 2 — Engine normalises to Canonical Data Model (CDM).
        Step 3a — CDM translated to XML → sent to Inventory /stock/deduct.
        Step 3b — CDM translated to account-centric JSON → sent to Accounting /journal.
      value:
        step_1_pos_raw_json:
          event_type: SaleCompleted
          sku: SKU-1002
          product_name: Wireless Mouse
          qty: 3
          unit_price: 150000
          total: 450000
          cashier: siti
          source: pos-service

        step_2_canonical_data_model:
          canonical_version: "1.0"
          event_type: SaleCompleted
          correlation_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          occurred_at: "2024-06-01T10:00:00Z"
          source_system: pos-service
          product:
            sku: SKU-1002
            name: Wireless Mouse
          quantity: 3
          monetary:
            unit_price: 150000
            total: 450000
            currency: IDR
          actor: siti

        step_3a_inventory_xml_translated:
          format: XML
          note: >
            Canonical JSON translated to XML by the Message Translator.
            Sent via POST to Inventory /stock/deduct with Content-Type application/xml.
          payload: |
            <StockDeduction>
              <Sku>SKU-1002</Sku>
              <Quantity>3</Quantity>
              <CorrelationId>a1b2c3d4-e5f6-7890-abcd-ef1234567890</CorrelationId>
            </StockDeduction>

        step_3b_accounting_ledger_json_translated:
          format: JSON
          note: >
            Canonical JSON translated to account-centric schema by the Message Translator.
            Schema differs from POS JSON — uses account_code/credit/debit (double-entry).
          entries:
            - account_code: "4000-Revenue"
              credit: 450000
              debit: 0
              currency: IDR
              memo: "Sale of 3 x Wireless Mouse (SKU-1002)"
              correlation_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
            - account_code: "1000-Cash"
              credit: 0
              debit: 450000
              currency: IDR
              memo: "Cash received — Sale of 3 x Wireless Mouse (SKU-1002)"
              correlation_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
